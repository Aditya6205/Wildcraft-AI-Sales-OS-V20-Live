name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "v20-site.html.xz"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build final V20 site from local package
        shell: bash
        run: |
          set -euo pipefail
          test -f v20-site.html.xz || { echo "Missing v20-site.html.xz"; exit 1; }
          echo "e9d3a6250e42bcbce573551790b0b39e6becca5b0b03d992e146e5ef3be65a28  v20-site.html.xz" | sha256sum -c -
          mkdir -p _site
          xz -dc v20-site.html.xz > _site/index.html
          echo "84ec113c10c440878c84f7f9a4719046bbf5596fb9f4868e0e80e692712d6c28  _site/index.html" | sha256sum -c -
          touch _site/.nojekyll
          echo "Final V20 site built successfully."
          wc -c _site/index.html
          if grep -q "Failed to execute 'atob'" _site/index.html; then
            echo "Unexpected old loader error text found" >&2
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload final site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
